 style="animation-delay:0.95s"/></g><g class="g-wing"><rect class="px c-wing" x="197" y="158" width="40.5" height="8.5" style="animation-delay:0.65s"/><rect class="px c-wing" x="189" y="166" width="48.5" height="8.5" style="animation-delay:0.64s"/><rect class="px c-wing" x="181" y="174" width="48.5" height="8.5" style="animation-delay:0.63s"/><rect class="px c-wing" x="173" y="182" width="48.5" height="8.5" style="animation-delay:0.62s"/><rect class="px c-wing" x="181" y="190" width="24.5" height="8.5" style="animation-delay:0.67s"/></g><g class="g-tail"><rect class="px c-key" x="85" y="166" width="80.5" height="8.5" style="animation-delay:0.25s"/><rect class="px c-key" x="85" y="174" width="80.5" height="8.5" style="animation-delay:0.27s"/><rect class="px c-key" x="85" y="182" width="16.5" height="8.5" style="animation-delay:0.29s"/><rect class="px c-key" x="109" y="182" width="16.5" height="8.5" style="animation-delay:0.38s"/><rect class="px c-key" x="133" y="182" width="16.5" height="8.5" style="animation-delay:0.47s"/><rect class="px c-key" x="85" y="190" width="16.5" height="8.5" style="animation-delay:0.31s"/><rect class="px c-key" x="109" y="190" width="16.5" height="8.5" style="animation-delay:0.40s"/><rect class="px c-key" x="85" y="198" width="16.5" height="8.5" style="animation-delay:0.33s"/></g></g>
